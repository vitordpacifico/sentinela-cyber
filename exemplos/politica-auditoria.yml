# Política usada na Auditoria do Protótipo (scripts/auditoria_gs.py).
# Igual à do repositório, mas sem ignorar o protótipo com falhas.
gate:
  fail_on: high
  require_strong_evidence: true
  # Testes do app usam dados fictícios e não entram na auditoria.
  ignore_paths:
    - "*/__tests__/*"
    - "src/testes/*"
  ignore_rules: []
