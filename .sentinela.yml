# Política do Security Gate do Sentinela para ESTE repositório.
gate:
  # Severidade mínima que pode bloquear o merge.
  fail_on: high
  # Só bloqueia com evidência forte: fluxo de dados comprovado (taint),
  # dois motores concordando (ex. regra + Bandit) ou token de provedor.
  # Achados com evidência única viram aviso.
  require_strong_evidence: true
  # Código propositalmente vulnerável usado em testes e no benchmark.
  ignore_paths:
    - "benchmark/corpus/*"
    - "tests/fixtures/*"
    # Protótipo com vazamentos inseridos de propósito para a Global Solution.
    - "exemplos/prototipo-com-falhas/*"
    # CPF e Cartão SUS válidos usados de propósito nos testes do módulo.
    - "tests/unit/test_pii.py"
  ignore_rules: []
